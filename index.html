
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Franchise Bedarfsanalyse Deutschland</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0} body{font-family:Arial,sans-serif}
.panel{position:absolute;z-index:1000;right:18px;top:18px;width:350px;background:#fff;padding:16px;border-radius:12px;box-shadow:0 5px 24px #0003}
h3{margin:0 0 10px}.row{margin:9px 0;font-size:13px}.sw{display:inline-block;width:25px;height:14px;vertical-align:middle;margin:0 7px;border:1px solid #999}
.heavy{background:repeating-linear-gradient(45deg,#f9731644 0 5px,#f97316 5px 7px)}
.light{background:repeating-linear-gradient(-45deg,#2563eb44 0 5px,#2563eb 5px 7px)}
.both{background:repeating-linear-gradient(45deg,#dc262644 0 5px,#dc2626 5px 7px)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}
.status{position:absolute;z-index:1000;left:18px;bottom:18px;background:#111827;color:#fff;padding:9px 12px;border-radius:8px;font-size:12px}
input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd3dc;border-radius:7px;margin:5px 0 10px}
.note{font-size:11px;color:#64748b;background:#f8fafc;padding:9px;border-radius:7px;line-height:1.4}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h3>Bedarfs-Filter <small id="count" style="float:right;color:#64748b;font-weight:normal">lädt…</small></h3>
<input id="search" type="text" placeholder="PLZ, Ort, KST oder Netzkennung…">
<div class="row"><label><input id="fBoth" type="checkbox" checked> <span class="sw both"></span>Light + Heavy fehlen</label></div>
<div class="row"><label><input id="fHeavy" type="checkbox" checked> <span class="sw heavy"></span>Heavy-Bedarf</label></div>
<div class="row"><label><input id="fLight" type="checkbox" checked> <span class="sw light"></span>Light-Bedarf</label></div>
<div class="row"><label><input id="fCenters" type="checkbox" checked> <span class="dot" style="background:#111827"></span>Center anzeigen</label></div>
<div class="note"><b>BU + 50 km:</b> Mixed deckt Light und Heavy. Light deckt Light, Heavy deckt Heavy. Für <b>jeden Punkt der Karte</b> wird geprüft, was innerhalb 50 km vorhanden ist. Dadurch werden auch Regionen ohne irgendein Center als Bedarf markiert.</div>
</div>
<div id="status" class="status">Lade daten.csv…</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const map=L.map('map').setView([51.15,10.45],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const statusEl=document.getElementById('status'), countEl=document.getElementById('count');
let centers=[], markers=L.layerGroup().addTo(map), coverageLayer=null;

function normNum(v){
  if(v==null)return NaN;
  let s=String(v).trim().replace(/\s/g,'').replace(',','.');
  return Number.parseFloat(s);
}
function distKm(a,b,c,d){
  const R=6371, p=Math.PI/180, x=(c-a)*p, y=(d-b)*p;
  const q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;
  return 2*R*Math.asin(Math.sqrt(q));
}
function coverage(lat,lng){
  let light=false,heavy=false,n=0,near=[];
  for(const c of centers){
    const d=distKm(lat,lng,c.lat,c.lng);
    if(d<=50){
      n++; if(near.length<8)near.push({c,d});
      if(c.bu==='Light'||c.bu==='Mixed')light=true;
      if(c.bu==='Heavy'||c.bu==='Mixed')heavy=true;
      if(light&&heavy&&near.length>=8) break;
    }
  }
  let type='covered';
  if(!light&&!heavy)type='both';
  else if(light&&!heavy)type='heavy';
  else if(!light&&heavy)type='light';
  return {type,light,heavy,n,near};
}
function color(type){
  if(type==='both')return [220,38,38,95];
  if(type==='heavy')return [249,115,22,85];
  if(type==='light')return [37,99,235,85];
  return [0,0,0,0];
}
function visible(type){
  return type==='both'?fBoth.checked:type==='heavy'?fHeavy.checked:type==='light'?fLight.checked:false;
}

// Canvas tile = zusammenhängende Versorgungsfläche, keine Center-Kreise.
const Coverage=L.GridLayer.extend({
 createTile:function(coords){
   const tile=document.createElement('canvas'), S=256; tile.width=tile.height=S;
   const ctx=tile.getContext('2d'), step=6, z=coords.z;
   for(let y=0;y<S;y+=step) for(let x=0;x<S;x+=step){
     const px=L.point(coords.x*S+x+step/2,coords.y*S+y+step/2);
     const ll=map.unproject(px,z);
     // Nur sinnvoller Deutschland-/Randbereich, damit nicht halb Europa eingefärbt wird.
     if(ll.lat<46.8||ll.lat>55.3||ll.lng<5.3||ll.lng>15.7) continue;
     const st=coverage(ll.lat,ll.lng).type;
     if(!visible(st))continue;
     const c=color(st); ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})`;
     ctx.fillRect(x,y,step+1,step+1);
     // Schraffur
     ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},.55)`;ctx.lineWidth=.7;
     if(st==='light'){ctx.beginPath();ctx.moveTo(x,y+step);ctx.lineTo(x+step,y);ctx.stroke();}
     else {ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+step,y+step);ctx.stroke();}
   }
   return tile;
 }
});
function redrawCoverage(){ if(coverageLayer)map.removeLayer(coverageLayer); coverageLayer=new Coverage({tileSize:256,opacity:1,zIndex:250}); coverageLayer.addTo(map); }

function addMarkers(){
 markers.clearLayers();
 for(const c of centers){
   const col=c.bu==='Mixed'?'#10b981':c.bu==='Heavy'?'#f97316':'#2563eb';
   L.circleMarker([c.lat,c.lng],{radius:6,color:'#fff',weight:2,fillColor:col,fillOpacity:.95})
    .bindPopup(`<b>${c.ges||c.kst}</b><br>${c.str}, ${c.plz} ${c.ort}<br><b>BU:</b> ${c.bu}<br><b>KST:</b> ${c.kst}`)
    .addTo(markers);
 }
}
function parse(rows){
 let hi=rows.findIndex(r=>r && r.some(v=>String(v).trim()==='KST') && r.some(v=>String(v).trim()==='BU'));
 if(hi<0)throw new Error('Kopfzeile KST/BU nicht gefunden');
 const h=rows[hi].map(v=>String(v??'').replace(/\r?\n/g,' ').trim());
 const idx=n=>h.indexOf(n);
 const I={kst:idx('KST'),bu:idx('BU'),netz:idx('Netzkennung'),ges:idx('Gesellschaft'),str:idx('Straße'),plz:idx('PLZ'),ort:idx('Ort'),lat:idx('Lat.'),lng:idx('Long.')};
 centers=[];
 for(const r of rows.slice(hi+1)){
   const lat=normNum(r[I.lat]),lng=normNum(r[I.lng]), raw=String(r[I.bu]??'').trim().toLowerCase();
   let bu=raw.includes('mixed')?'Mixed':raw.includes('heavy')?'Heavy':raw.includes('light')?'Light':'';
   if(!Number.isFinite(lat)||!Number.isFinite(lng)||!bu)continue;
   // Offensichtliche Koordinatenfehler nicht heimlich als Center in falscher Region verwenden.
   if(lat<46||lat>56||lng<5||lng>16)continue;
   centers.push({lat,lng,bu,kst:r[I.kst]??'',netz:r[I.netz]??'',ges:r[I.ges]??'',str:r[I.str]??'',plz:r[I.plz]??'',ort:r[I.ort]??''});
 }
 countEl.textContent=centers.length+' Center';
 addMarkers(); redrawCoverage();
 statusEl.innerHTML=`✓ <b>${centers.length} Center</b> geladen · Flächen werden aus BU + 50 km berechnet`;
}
Papa.parse('./daten.csv?ts='+Date.now(),{download:true,header:false,skipEmptyLines:'greedy',
 complete:r=>{try{parse(r.data)}catch(e){statusEl.textContent='Fehler: '+e.message}},
 error:e=>statusEl.textContent='daten.csv konnte nicht geladen werden: '+e
});
[fBoth,fHeavy,fLight].forEach(e=>e.addEventListener('change',redrawCoverage));
fCenters.addEventListener('change',()=>fCenters.checked?markers.addTo(map):map.removeLayer(markers));
document.getElementById('search').addEventListener('input',function(){
 const q=this.value.trim().toLowerCase(); if(q.length<2)return;
 const c=centers.find(x=>[x.plz,x.ort,x.kst,x.netz,x.ges].some(v=>String(v).toLowerCase().includes(q)));
 if(c){map.setView([c.lat,c.lng],10); const st=coverage(c.lat,c.lng); statusEl.textContent=`${c.ort}: ${st.n} Center im 50-km-Radius · ${st.type==='covered'?'Light + Heavy abgedeckt':st.type==='both'?'Light + Heavy fehlen':st.type==='heavy'?'Heavy fehlt':'Light fehlt'}`;}
});
map.on('click',e=>{
 const st=coverage(e.latlng.lat,e.latlng.lng);
 const label=st.type==='covered'?'Light + Heavy abgedeckt':st.type==='both'?'Light + Heavy fehlen':st.type==='heavy'?'Heavy-Bedarf':'Light-Bedarf';
 L.popup().setLatLng(e.latlng).setContent(`<b>${label}</b><br>${st.n} Center innerhalb 50 km<br>Light: ${st.light?'✓':'✗'} &nbsp; Heavy: ${st.heavy?'✓':'✗'}`).openOn(map);
});
</script>
</body></html>
