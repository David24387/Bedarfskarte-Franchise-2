name: BU-Filter Light Heavy Mixed hinzufügen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-bu-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centerfilter robust ergänzen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<div class="group"><label><input id="centers" type="checkbox" checked>Alle Center anzeigen</label></div>'
          new='''<div class="group"><label><input id="centers" type="checkbox" checked>Alle Center anzeigen</label></div>
<div class="group"><label><input class="bu-filter" value="Mixed" type="checkbox" checked><span class="dot" style="background:#10b981"></span>Mixed anzeigen</label></div>
<div class="group"><label><input class="bu-filter" value="Light" type="checkbox" checked><span class="dot" style="background:#3b82f6"></span>Light anzeigen</label></div>
<div class="group"><label><input class="bu-filter" value="Heavy" type="checkbox" checked><span class="dot" style="background:#f97316"></span>Heavy anzeigen</label></div>'''
          if 'class="bu-filter"' not in s:
              if old not in s:
                  raise SystemExit('Center-Schalter nicht gefunden')
              s=s.replace(old,new,1)

          # Bestehende filter()-Funktion per Klammermatching finden (minifizierte Einzeiler sind erlaubt).
          needle='function filter('
          start=s.find(needle)
          if start<0:
              raise SystemExit('filter()-Funktion nicht gefunden')
          brace=s.find('{',start)
          if brace<0:
              raise SystemExit('Startklammer von filter() nicht gefunden')
          depth=0; end=None; quote=None; esc=False
          for i in range(brace,len(s)):
              ch=s[i]
              if quote:
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch==quote: quote=None
                  continue
              if ch in ('\"',"'",'`'):
                  quote=ch; continue
              if ch=='{': depth+=1
              elif ch=='}':
                  depth-=1
                  if depth==0:
                      end=i; break
          if end is None:
              raise SystemExit('Ende von filter() nicht gefunden')

          block=s[start:end+1]
          marker='const enabledBU=new Set('
          if marker not in block:
              extra="const enabledBU=new Set([...document.querySelectorAll('.bu-filter:checked')].map(x=>x.value));markers.forEach(x=>{if(!enabledBU.has(x.c.buType)){x.m.setStyle({opacity:0,fillOpacity:0});x.m.options.interactive=false}});"
              block=block[:-1]+extra+'}'
              s=s[:start]+block+s[end+1:]

          # Neue BU-Schalter lösen dieselbe bestehende Filterlogik aus.
          listener="document.querySelectorAll('.bu-filter').forEach(x=>x.addEventListener('change',filter));"
          if listener not in s:
              initpos=s.rfind('init();')
              if initpos<0:
                  raise SystemExit('init(); nicht gefunden')
              s=s[:initpos]+listener+'\n'+s[initpos:]

          p.write_text(s,encoding='utf-8')
          print('BU-Filter erfolgreich in index.html eingebaut')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Keine Änderung nötig"
          else
            git commit -m "Add independent Light Heavy Mixed center filters"
            git push
          fi
