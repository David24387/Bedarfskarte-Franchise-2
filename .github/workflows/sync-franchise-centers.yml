name: Franchise-Center aus Google Sheet synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Veröffentlichtes Google Sheet als CSV laden und prüfen
        run: |
          set -euo pipefail
          URL="https://docs.google.com/spreadsheets/d/1b7teC32nPUSmsSyGCreHuTC5WMu3ebienvEEuQnHcc0/export?format=csv"
          curl --fail --location --retry 6 --retry-delay 5 "$URL" -o daten-neu.csv
          test -s daten-neu.csv
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          p=Path('daten-neu.csv')
          rows=list(csv.reader(p.open(encoding='utf-8-sig', newline='')))
          if len(rows) < 2:
              raise SystemExit('Google Sheet enthält keine ausreichenden Daten')

          headers=[(x or '').strip() for x in rows[0]]
          low={h.lower():i for i,h in enumerate(headers)}
          net_i=next((i for i,h in enumerate(headers) if h.lower() in ('stammdaten filialnetz netz','netz')),None)
          bu_i=next((i for i,h in enumerate(headers) if h.lower()=='bu'),None)
          if net_i is None or bu_i is None:
              raise SystemExit(f'Netz- oder BU-Spalte fehlt. Header: {headers}')

          valid=[]
          for row in rows[1:]:
              if not any((x or '').strip() for x in row):
                  continue
              net=(row[net_i] if net_i < len(row) else '').strip()
              if net in ('02 - FRA','01 - ERM'):
                  valid.append(row)

          nets=Counter((r[net_i] if net_i<len(r) else '').strip() for r in valid)
          bus=Counter((r[bu_i] if bu_i<len(r) else '').strip() for r in valid)
          print(f'{len(valid)} FRA+ERM Center aus Google Sheet geladen')
          print('Netze:',dict(nets))
          print('BU:',dict(bus))

          # Erwarteter Sollbestand laut Leistungsverzeichnis: 391 FRA+ERM Center.
          # Nie eine unvollständige Datei über den letzten guten Datenstand schreiben.
          if len(valid) != 391:
              raise SystemExit(f'ABBRUCH: Erwartet werden 391 FRA+ERM Center, erhalten wurden {len(valid)}. daten.csv bleibt unverändert.')

          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f)
              w.writerow(headers)
              w.writerows(valid)
          PY
          mv daten-neu.csv daten.csv

      - name: Nur bei Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen im Google Sheet."
          else
            git commit -m "Sync 391 FRA and ERM centers from Google Sheet"
            git push
          fi
