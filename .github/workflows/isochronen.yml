name: 20-/40-Minuten-Fahrzeitgebiete aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * *'
permissions:
  contents: write
concurrency:
  group: isochronen-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 20-/40-Minuten-Isochronen validieren und ergänzen
        id: build_isochrones
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          ISOCHRONE_BATCH_SIZE: "75"
        run: python build_isochronen.py

      - name: JSON-Struktur vor Commit prüfen
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('isochronen_20_40.json')
          if not p.exists() or p.stat().st_size == 0:
              sys.exit('FEHLER: isochronen_20_40.json fehlt oder ist leer.')
          data=json.loads(p.read_text(encoding='utf-8'))
          features=data.get('features') or []
          if not features:
              sys.exit('FEHLER: isochronen_20_40.json enthält keine Features.')
          print(f'JSON-Prüfung erfolgreich: {len(features)} Fahrzeitgebiete, {p.stat().st_size} Bytes.')
          PY

      - name: Isochronen-Fortschritt committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isochronen_20_40.json isochronen_20_40_historisch.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an isochronen_20_40.json."
          else
            git commit -m "Update validated 20/40-minute drive-time areas"
            git pull --rebase origin main
            git push
          fi

      - name: Status ausgeben
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('isochronen_20_40.json')
          if not p.exists() or p.stat().st_size == 0:
              print('STATUS: Keine nutzbare isochronen_20_40.json vorhanden.')
          else:
              try:
                  data=json.loads(p.read_text(encoding='utf-8'))
                  n=len(data.get('features',[]))
                  validation=(data.get('properties') or {}).get('validation','nicht markiert')
                  expected=(data.get('properties') or {}).get('expectedCenters')
                  print(f'STATUS: {n}/{expected if expected is not None else "unbekannt"} Fahrzeitgebiete gespeichert; Validierung: {validation}.')
                  if expected is None:
                      print('Sollanzahl noch nicht ermittelt; siehe Berechnungsschritt.')
                  elif n < expected:
                      print(f'Noch {expected-n} offen. Der nächste Lauf ergänzt ausschließlich fehlende oder ungültige Standorte.')
                  else:
                      print(f'Vollständig: {n}/{expected}.')
              except Exception as e:
                  print(f'STATUS: isochronen_20_40.json ist nicht lesbar: {e}')
          PY
