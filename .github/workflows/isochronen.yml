name: 30-Minuten-Fahrzeitgebiete aktualisieren
on:
  workflow_dispatch:
  push:
    paths:
      - "daten.csv"
      - "build_isochronen.py"
  schedule:
    - cron: "37 4 * * 1"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 30-Minuten-Isochronen erzeugen
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python build_isochronen.py
      - name: Isochronen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isochronen.json
          git diff --cached --quiet || git commit -m "Update 30-minute drive-time areas"
          git push
