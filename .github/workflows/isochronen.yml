name: 30-Minuten-Fahrzeitgebiete aktualisieren
on:
  workflow_dispatch:
  push:
    paths:
      - "daten.csv"
      - "build_isochronen.py"
  schedule:
    # ORS quota resets every 24h. Several spaced attempts make the workflow
    # resume automatically once quota is available again.
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: isochronen-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 30-Minuten-Isochronen erzeugen
        id: build_isochrones
        continue-on-error: true
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          ISOCHRONE_BATCH_SIZE: "390"
        run: python build_isochronen.py

      - name: Isochronen-Fortschritt immer committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f isochronen.json ]; then
            git add isochronen.json
            git diff --cached --quiet || git commit -m "Update 30-minute drive-time areas (including partial progress)"
            git pull --rebase origin main
            git push
          else
            echo "Keine isochronen.json vorhanden – nichts zu committen."
          fi

      - name: Status ausgeben
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('isochronen.json')
          if not p.exists():
              print('Keine isochronen.json vorhanden.')
          else:
              n=len(json.loads(p.read_text(encoding='utf-8')).get('features',[]))
              print(f'Aktueller Stand: {n}/390 Fahrzeitgebiete gespeichert.')
              if n < 390:
                  print('Noch nicht vollständig. Der nächste geplante Lauf versucht automatisch weiterzumachen.')
              else:
                  print('Vollständig: 390/390.')
          PY
