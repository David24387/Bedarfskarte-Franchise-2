name: Change Top-20 hotspot styling to black

on:
  push:
    paths:
      - '.github/workflows/change-hotspots-black.yml'

permissions:
  contents: write

jobs:
  update-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Top-20 styling from gold to black
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.gold{background:#f59e0b22;border:2px solid #f59e0b}', '.gold{background:#11182722;border:2px solid #111827}')
          s = s.replace('.hotspot-label{background:#111827;color:#fff;border:1px solid #f59e0b;', '.hotspot-label{background:#111827;color:#fff;border:1px solid #111827;')
          s = s.replace('Gold = Top-20-%-Lücken nach Marktpotenzial', 'Schwarz = Top-20-%-Lücken nach Marktpotenzial')
          s = s.replace("style:{color:'#f59e0b',weight:3,fillColor:'#f59e0b',fillOpacity:.05}", "style:{color:'#111827',weight:3,fillColor:'#111827',fillOpacity:.08}")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show Top-20 market gaps in black"
          git push
