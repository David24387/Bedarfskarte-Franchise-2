name: Apply map updates
on:
  push:
    paths:
      - '.github/workflows/apply-map-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename visible Center labels to Standorte
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('Center / BU','Standorte / BU'),
            ('Alle Center anzeigen','Alle Standorte anzeigen'),
            (' Fahrzeitgebiete geladen · lade Center…',' Fahrzeitgebiete geladen · lade Standorte…'),
            (' Center · Mixed ',' Standorte · Mixed '),
            ("${c.ort||'Center'} – 30-Minuten-Fahrzeit","${c.ort||'Standort'} – 30-Minuten-Fahrzeit"),
            ('eines passenden Centers liegt','eines passenden Standorts liegt'),
            ('Bedarfsfläche oder Center für den','Bedarfsfläche oder Standort für den'),
            ('Center im 30-Minuten-Gebiet','Standorte im 30-Minuten-Gebiet'),
            ('Center in Fahrzeit','Standorte in Fahrzeit'),
            (' Center</span>',' Standorte</span>')
          ]
          changed=0
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new)
                  changed+=1
          # Counter oben: z. B. 390/390 Center · 30 Min. -> Standorte
          s=s.replace("${shown}/${centers.length} Center · 30 Min.","${shown}/${centers.length} Standorte · 30 Min.")
          p.write_text(s,encoding='utf-8')
          print(f'{changed} sichtbare Center-Bezeichnungen auf Standorte geändert.')
          PY
      - name: Verify visible terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['Standorte / BU','Alle Standorte anzeigen','Standorte · Mixed']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Standort-Bezeichnungen fehlen: '+str(missing))
          print('Standort-Bezeichnungen erfolgreich geprüft.')
          PY
      - name: Commit map terminology update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig"
          else
            git commit -m "Rename Center labels to Standorte"
            git push
          fi
