name: Apply map updates
on:
  push:
    paths:
      - '.github/workflows/apply-map-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Light demand from blue to yellow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('.blue{background:repeating-linear-gradient(-45deg,#3b82f633 0 4px,#3b82f6 4px 6px)}',
             '.yellow{background:repeating-linear-gradient(-45deg,#facc1538 0 4px,#eab308 4px 6px)}'),
            ('<span class="sw blue"></span>Blau = Light fehlt',
             '<span class="sw yellow"></span>Gelb = Light fehlt'),
            ("['rgba(59,130,246,.20)','rgba(37,99,235,.62)',-1]",
             "['rgba(250,204,21,.25)','rgba(202,138,4,.78)',-1]"),
            ("headline='🟦 <b>LIGHT-BEDARF:</b><br>Innerhalb von 30 Minuten Fahrzeit ist keine Light-Abdeckung vorhanden.';col='#3b82f6'",
             "headline='🟨 <b>LIGHT-BEDARF:</b><br>Innerhalb von 30 Minuten Fahrzeit ist keine Light-Abdeckung vorhanden.';col='#ca8a04'")
          ]
          changed=0
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new,1); changed+=1
              elif new in s:
                  print('Bereits umgesetzt:',new[:60])
              else:
                  raise SystemExit('Erwarteter Light-Farbbaustein nicht gefunden: '+old[:100])
          if changed:
              p.write_text(s,encoding='utf-8')
          print(f'{changed} Light-Farbbausteine aktualisiert.')
          PY
      - name: Verify FRA and ERM demand logic
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          # Regionaler Bedarf basiert auf allen Features in isochronen.json.
          # Die Features werden nicht nach FRA/ERM gefiltert; daher werden beide Netze berücksichtigt,
          # sobald der 390-Center-Isochronenlauf die neue Datei committed.
          required=["for(const f of iso)","f.properties.buType","coverage(lat,lng)"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Coverage-Logik unerwartet verändert: '+str(missing))
          print('Coverage nutzt alle Isochronen-Features ohne FRA-only Filter.')
          PY
      - name: Commit map updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Keine Änderungen nötig"
          else
            git commit -m "Change Light demand zones from blue to yellow"
            git push
          fi
