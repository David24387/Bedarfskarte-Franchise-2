name: Regionaldaten aktualisieren
on:
  workflow_dispatch:
  push:
    paths: ["build_regionaldaten.py"]
  schedule:
    - cron: "17 4 1 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_regionaldaten.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regionaldaten.json
          git diff --cached --quiet || git commit -m "Update Regionaldaten"
          git push
